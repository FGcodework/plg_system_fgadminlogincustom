PLG_SYSTEM_FGADMINLOGINCUSTOM_HEADER_BG_DESC="Farba pozadia horného pásu (viditeľné iba ak 'Skryť hlavičku a pätičku' nie je zapnuté)."
PLG_SYSTEM_FGADMINLOGINCUSTOM_HEADER_TEXT_LABEL="Farba textu a ikon v páse"
PLG_SYSTEM_FGADMINLOGINCUSTOM_HEADER_TEXT_DESC="Farba textu, odkazov a ikon v hornom páse."
PLG_SYSTEM_FGADMINLOGINCUSTOM_HIDE_LANG_SWITCHER_LABEL="Skryť jazykový prepínač"
PLG_SYSTEM_FGADMINLOGINCUSTOM_HIDE_LANG_SWITCHER_DESC="Skryje dropdown na výber jazyka (napr. 'en-GB') v hornom páse."
PLG_SYSTEM_FGADMINLOGINCUSTOM_HEADER_MATCH_BTN_LABEL="Zladiť tlačidlo frontend odkazu s login tlačidlom"
PLG_SYSTEM_FGADMINLOGINCUSTOM_HEADER_MATCH_BTN_DESC="Tlačidlo s odkazom na frontend v hornom páse (napr. 'Otvoriť názov webu') sa prefarbí rovnakými farbami (pozadie/hover/text), aké máš nastavené nižšie v sekcii 'Prihlasovacia karta a farby' pre tlačidlo."
PLG_SYSTEM_FGADMINLOGINCUSTOM_LOGO_HEIGHT_LABEL="Pevná výška loga (px)"
PLG_SYSTEM_FGADMINLOGINCUSTOM_LOGO_HEIGHT_DESC="Voliteľné. Nechaj prázdne pre voľné škálovanie (pomer strán sa vždy zachová, podľa hodnoty Max. šírka loga vyššie). Zadaním hodnoty dostane logo pevný box šírka × výška, podľa režimu Fit nižšie."
PLG_SYSTEM_FGADMINLOGINCUSTOM_LOGO_FIT_LABEL="Režim vyplnenia (Fit)"
PLG_SYSTEM_FGADMINLOGINCUSTOM_LOGO_FIT_DESC="Platí iba ak je zadaná Pevná výška loga. Contain: celé logo je vždy viditeľné, môže ostať prázdny priestor. Cover: box je vyplnený celý, logo môže byť orezané."
PLG_SYSTEM_FGADMINLOGINCUSTOM_LOGO_FIT_CONTAIN="Contain (zobraziť celé logo)"
PLG_SYSTEM_FGADMINLOGINCUSTOM_LOGO_FIT_COVER="Cover (vyplniť box, možný orez)"
PLG_SYSTEM_FGADMINLOGINCUSTOM_FIELDSET_IMPORTEXPORT="Export / Import"
PLG_SYSTEM_FGADMINLOGINCUSTOM_EXPORT_JSON_LABEL="Export (aktuálne nastavenia)"
PLG_SYSTEM_FGADMINLOGINCUSTOM_EXPORT_JSON_DESC="Iba na čítanie. Skopíruj tento JSON na prenos dizajnu do kópie tohto pluginu na inom webe (vlož ho tam do poľa Import)."
PLG_SYSTEM_FGADMINLOGINCUSTOM_IMPORT_JSON_LABEL="Import"
PLG_SYSTEM_FGADMINLOGINCUSTOM_IMPORT_JSON_DESC="Vlož JSON exportovaný z iného webu a klikni Save. Polia vyššie sa na tej istej obrazovke predvyplnia importovanými hodnotami - skontroluj ich a klikni Save ešte raz, aby sa reálne uložili. Toto pole sa po použití samo vyprázdni. Z bezpečnostných dôvodov sa nastavenie Vlastný JavaScript nikdy neimportuje - ak ho potrebuješ, zadaj ho ručne."
PLG_SYSTEM_FGADMINLOGINCUSTOM_IMPORT_APPLIED="Import bol aplikovaný do polí nižšie - skontroluj ich a klikni znova Save, aby sa uložili."
PLG_SYSTEM_FGADMINLOGINCUSTOM_IMPORT_INVALID_JSON="Vložený text v poli Import nie je platný JSON - nič sa nezmenilo."
PLG_SYSTEM_FGADMINLOGINCUSTOM_FIELDSET_PRESET="Preddefinovaná téma"
PLG_SYSTEM_FGADMINLOGINCUSTOM_THEME_PRESET_LABEL="Aplikovať preset"
PLG_SYSTEM_FGADMINLOGINCUSTOM_THEME_PRESET_DESC="Vyber farebnú schému a klikni Save. Farebné polia v celom formulári (pozadie, karta, tlačidlá, header) sa predvyplnia hodnotami presetu - skontroluj ich a klikni Save ešte raz, aby sa uložili. Menia sa iba farby; prepínače layoutu/súkromia (sidebar, chrome a pod.) ostávajú nedotknuté. Toto pole sa po použití samo vyprázdni."
PLG_SYSTEM_FGADMINLOGINCUSTOM_THEME_PRESET_NONE="- Vyber preset -"
PLG_SYSTEM_FGADMINLOGINCUSTOM_THEME_PRESET_RESET="Predvolené (farby šablóny Atum)"
PLG_SYSTEM_FGADMINLOGINCUSTOM_THEME_PRESET_DARK="Tmavá"
PLG_SYSTEM_FGADMINLOGINCUSTOM_THEME_PRESET_CORPORATE_BLUE="Firemná modrá"
PLG_SYSTEM_FGADMINLOGINCUSTOM_THEME_PRESET_GREEN="Zelená"
PLG_SYSTEM_FGADMINLOGINCUSTOM_THEME_PRESET_ORANGE="Oranžová"
PLG_SYSTEM_FGADMINLOGINCUSTOM_THEME_PRESET_MINIMAL="Minimalistická"
PLG_SYSTEM_FGADMINLOGINCUSTOM_PRESET_APPLIED="Preset bol aplikovaný do farebných polí nižšie - skontroluj ich a klikni znova Save, aby sa uložili."
PLG_SYSTEM_FGADMINLOGINCUSTOM_AUTO_CONTRAST_DESC="Nechaj prázdne, ak je vyššie nastavená farba pozadia - automaticky sa dopočíta čitateľná čierna/biela farba textu (WCAG kontrast). Zadaním hodnoty tu automatický výpočet prepíšeš."
PLG_SYSTEM_FGADMINLOGINCUSTOM_CARD_SHADOW_LABEL="Tieň karty"
PLG_SYSTEM_FGADMINLOGINCUSTOM_CARD_SHADOW_DESC="Pridá hĺbku pod prihlasovaciu kartu."
PLG_SYSTEM_FGADMINLOGINCUSTOM_CARD_SHADOW_NONE="Žiadny"
PLG_SYSTEM_FGADMINLOGINCUSTOM_CARD_SHADOW_SUBTLE="Jemný"
PLG_SYSTEM_FGADMINLOGINCUSTOM_CARD_SHADOW_MEDIUM="Stredný"
PLG_SYSTEM_FGADMINLOGINCUSTOM_CARD_SHADOW_STRONG="Výrazný"
PLG_SYSTEM_FGADMINLOGINCUSTOM_CUSTOM_JS_LABEL="Vlastný JavaScript"
PLG_SYSTEM_FGADMINLOGINCUSTOM_CUSTOM_JS_DESC="Voliteľný JavaScript spustený iba na admin prihlasovacej stránke (načítaný ako defer). Nezaobaľuj ho do elementu script - vlož iba samotný kód. Používaj opatrne: beží bez sandboxovania, rovnaká úroveň dôvery ako Vlastné CSS."
PLG_SYSTEM_FGADMINLOGINCUSTOM_IMPORT_JS_SKIPPED="Importovaný JSON obsahoval hodnotu Vlastný JavaScript. Bola zámerne ignorovaná: importovaný kód by bežal na prihlasovacej stránke, kde sú polia s menom a heslom. Ak mu dôveruješ a naozaj ho potrebuješ, zadaj ho ručne."
PLG_SYSTEM_FGADMINLOGINCUSTOM_FIELD_SUPPORT_LABEL="Podpora tohto pluginu"
PLG_SYSTEM_FGADMINLOGINCUSTOM_FIELD_SUPPORT_DESC="Tento plugin je bezplatný, open source, a taký aj zostane - žiadna funkcia nie je zamknutá za platbou. Ak vám ušetril čas, jednorazový príspevok na <a href='https://ko-fi.com/fgcodework' target='_blank' rel='noopener'>Ko-fi</a> je vítaný, no úplne dobrovoľný. Ďalšie moje bezplatné Joomla rozšírenia nájdete na <a href='https://fgcodework.github.io/' target='_blank' rel='noopener'>fgcodework.github.io</a>."
PLG_SYSTEM_FGADMINLOGINCUSTOM_FIELDSET_SUPPORT="Podpora"
