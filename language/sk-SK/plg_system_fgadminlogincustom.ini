PLG_SYSTEM_FGADMINLOGINCUSTOM_FOOTER_TEXT_DESC="Voliteľný text alebo HTML zobrazený pod prihlasovacím tlačidlom (kde bol pôvodne odkaz 'Forgot your login details?'), napr. 'Created by ...'. Odkazy sú povolené."
PLG_SYSTEM_FGADMINLOGINCUSTOM_FIELDSET_HEADER="Horný pás"
