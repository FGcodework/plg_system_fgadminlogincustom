; plg_system_fgadminlogincustom 1.0.0 - en-GB
PLG_SYSTEM_FGADMINLOGINCUSTOM="System - FG Admin Login Customizer"
PLG_SYSTEM_FGADMINLOGINCUSTOM_XML_DESCRIPTION="Visual customization of the /administrator login page (logo, background, colors, custom CSS). Joomla 4/5/6, Atum template."
PLG_SYSTEM_FGADMINLOGINCUSTOM_FIELDSET_LOGO="Logo & Layout"
PLG_SYSTEM_FGADMINLOGINCUSTOM_LOGO_LABEL="Custom logo"
PLG_SYSTEM_FGADMINLOGINCUSTOM_LOGO_DESC="Image shown centered above the login card."
PLG_SYSTEM_FGADMINLOGINCUSTOM_LOGO_WIDTH_LABEL="Logo max width (px)"
PLG_SYSTEM_FGADMINLOGINCUSTOM_LOGO_WIDTH_DESC="Maximum display width of the custom logo."
PLG_SYSTEM_FGADMINLOGINCUSTOM_HIDE_TEMPLATE_LOGO_LABEL="Hide template logo / Joomla branding"
PLG_SYSTEM_FGADMINLOGINCUSTOM_HIDE_TEMPLATE_LOGO_DESC="Hides the header (top-left) template logo. The login-logo slot above the form is kept for the custom logo."
PLG_SYSTEM_FGADMINLOGINCUSTOM_HIDE_CHROME_LABEL="Hide header & footer"
PLG_SYSTEM_FGADMINLOGINCUSTOM_HIDE_CHROME_DESC="Hides the admin template header and footer on the login page for a clean full-screen look."
PLG_SYSTEM_FGADMINLOGINCUSTOM_FIELDSET_BACKGROUND="Background"
PLG_SYSTEM_FGADMINLOGINCUSTOM_BG_TYPE_LABEL="Background type"
PLG_SYSTEM_FGADMINLOGINCUSTOM_BG_TYPE_NONE="- Template default -"
PLG_SYSTEM_FGADMINLOGINCUSTOM_BG_TYPE_COLOR="Solid color"
PLG_SYSTEM_FGADMINLOGINCUSTOM_BG_TYPE_GRADIENT="Gradient"
PLG_SYSTEM_FGADMINLOGINCUSTOM_BG_TYPE_IMAGE="Image"
PLG_SYSTEM_FGADMINLOGINCUSTOM_BG_COLOR_LABEL="Background color"
PLG_SYSTEM_FGADMINLOGINCUSTOM_GRAD_START_LABEL="Gradient start color"
PLG_SYSTEM_FGADMINLOGINCUSTOM_GRAD_END_LABEL="Gradient end color"
PLG_SYSTEM_FGADMINLOGINCUSTOM_GRAD_ANGLE_LABEL="Gradient angle (deg)"
PLG_SYSTEM_FGADMINLOGINCUSTOM_BG_IMAGE_LABEL="Background image"
PLG_SYSTEM_FGADMINLOGINCUSTOM_BG_IMAGE_DESC="Relative path to the image, e.g. images/bg.jpg (from the site root, no leading slash). Plain text field - the Media Manager browse dialog is not used here."
PLG_SYSTEM_FGADMINLOGINCUSTOM_BG_OVERLAY_LABEL="Overlay color"
PLG_SYSTEM_FGADMINLOGINCUSTOM_BG_OVERLAY_DESC="Semi-transparent overlay above the background image (improves login card readability)."
PLG_SYSTEM_FGADMINLOGINCUSTOM_BG_OVERLAY_OPACITY_LABEL="Overlay opacity (%)"
PLG_SYSTEM_FGADMINLOGINCUSTOM_FIELDSET_CARD="Login card & colors"
PLG_SYSTEM_FGADMINLOGINCUSTOM_CARD_BG_LABEL="Card background"
PLG_SYSTEM_FGADMINLOGINCUSTOM_CARD_TEXT_LABEL="Card text color"
PLG_SYSTEM_FGADMINLOGINCUSTOM_CARD_RADIUS_LABEL="Card border radius (px)"
PLG_SYSTEM_FGADMINLOGINCUSTOM_BTN_BG_LABEL="Button background"
PLG_SYSTEM_FGADMINLOGINCUSTOM_BTN_HOVER_LABEL="Button hover background"
PLG_SYSTEM_FGADMINLOGINCUSTOM_BTN_TEXT_LABEL="Button text color"
PLG_SYSTEM_FGADMINLOGINCUSTOM_LINK_COLOR_LABEL="Link color"
PLG_SYSTEM_FGADMINLOGINCUSTOM_FIELDSET_ADVANCED="Advanced"
PLG_SYSTEM_FGADMINLOGINCUSTOM_CUSTOM_CSS_LABEL="Custom CSS"
PLG_SYSTEM_FGADMINLOGINCUSTOM_CUSTOM_CSS_DESC="Appended last, applied only on the admin login page. No style tags."
PLG_SYSTEM_FGADMINLOGINCUSTOM_HIDE_SIDEBAR_LABEL="Hide left sidebar"
PLG_SYSTEM_FGADMINLOGINCUSTOM_HIDE_SIDEBAR_DESC="Hides the whole left panel on the login page (template logo panel and the 'Need Support?' Joomla links module)."
PLG_SYSTEM_FGADMINLOGINCUSTOM_HIDE_GENERATOR_LABEL="Remove generator meta tag"
PLG_SYSTEM_FGADMINLOGINCUSTOM_HIDE_GENERATOR_DESC="Removes the meta generator tag revealing Joomla in the page source of the login page."
PLG_SYSTEM_FGADMINLOGINCUSTOM_HIDE_FORGOT_LABEL="Hide 'Forgot your login details?' link"
PLG_SYSTEM_FGADMINLOGINCUSTOM_HIDE_FORGOT_DESC="Hides the password recovery link below the login form (points to the Joomla user guide)."
PLG_SYSTEM_FGADMINLOGINCUSTOM_FOOTER_TEXT_LABEL="Footer text below the form"
PLG_SYSTEM_FGADMINLOGINCUSTOM_FOOTER_TEXT_DESC="Optional text or HTML shown below the login button (where the 'Forgot your login details?' link used to be), e.g. 'Created by ...'. Links allowed."
PLG_SYSTEM_FGADMINLOGINCUSTOM_FIELDSET_HEADER="Header bar"
PLG_SYSTEM_FGADMINLOGINCUSTOM_HEADER_BG_LABEL="Header background color"
PLG_SYSTEM_FGADMINLOGINCUSTOM_HEADER_BG_DESC="Background color of the top header bar (only visible when 'Hide header & footer' is off)."
PLG_SYSTEM_FGADMINLOGINCUSTOM_HEADER_TEXT_LABEL="Header text & icon color"
PLG_SYSTEM_FGADMINLOGINCUSTOM_HEADER_TEXT_DESC="Color of the text, links and icons in the header bar."
PLG_SYSTEM_FGADMINLOGINCUSTOM_HIDE_LANG_SWITCHER_LABEL="Hide language switcher"
PLG_SYSTEM_FGADMINLOGINCUSTOM_HIDE_LANG_SWITCHER_DESC="Hides the language dropdown (e.g. 'en-GB') in the header bar."
PLG_SYSTEM_FGADMINLOGINCUSTOM_HEADER_MATCH_BTN_LABEL="Match frontend-link button to login button"
PLG_SYSTEM_FGADMINLOGINCUSTOM_HEADER_MATCH_BTN_DESC="Colors the header's frontend-link button (e.g. 'Open site name') using the same Button background/hover/text colors set below in 'Login card & colors'."
PLG_SYSTEM_FGADMINLOGINCUSTOM_LOGO_HEIGHT_LABEL="Logo fixed height (px)"
PLG_SYSTEM_FGADMINLOGINCUSTOM_LOGO_HEIGHT_DESC="Optional. Leave empty for free scaling (aspect ratio always preserved, using Logo max width above). Set a value to give the logo a fixed width x height box, using the Fit mode below."
PLG_SYSTEM_FGADMINLOGINCUSTOM_LOGO_FIT_LABEL="Fit mode"
PLG_SYSTEM_FGADMINLOGINCUSTOM_LOGO_FIT_DESC="Only applies when Logo fixed height is set. Contain: whole logo always visible, may leave empty space. Cover: fills the box completely, may crop the logo."
PLG_SYSTEM_FGADMINLOGINCUSTOM_LOGO_FIT_CONTAIN="Contain (show whole logo)"
PLG_SYSTEM_FGADMINLOGINCUSTOM_LOGO_FIT_COVER="Cover (fill box, may crop)"
PLG_SYSTEM_FGADMINLOGINCUSTOM_FIELDSET_IMPORTEXPORT="Export / Import"
PLG_SYSTEM_FGADMINLOGINCUSTOM_EXPORT_JSON_LABEL="Export (current settings)"
PLG_SYSTEM_FGADMINLOGINCUSTOM_EXPORT_JSON_DESC="Read-only. Copy this JSON to transfer the design to another site's copy of this plugin (paste it into the Import field there)."
PLG_SYSTEM_FGADMINLOGINCUSTOM_IMPORT_JSON_LABEL="Import"
PLG_SYSTEM_FGADMINLOGINCUSTOM_IMPORT_JSON_DESC="Paste JSON exported from another site and click Save. The fields above will refresh with the imported values on this same screen - review them and click Save once more to apply. This field clears itself after use. For security, the Custom JavaScript setting is never imported - enter it manually if you need it."
PLG_SYSTEM_FGADMINLOGINCUSTOM_IMPORT_APPLIED="Import applied to the fields below - review and click Save again to store them."
PLG_SYSTEM_FGADMINLOGINCUSTOM_IMPORT_INVALID_JSON="The pasted Import text is not valid JSON - nothing was changed."
PLG_SYSTEM_FGADMINLOGINCUSTOM_FIELDSET_PRESET="Theme Preset"
PLG_SYSTEM_FGADMINLOGINCUSTOM_THEME_PRESET_LABEL="Apply a preset"
PLG_SYSTEM_FGADMINLOGINCUSTOM_THEME_PRESET_DESC="Pick a color scheme and click Save. The color fields throughout this form (background, card, buttons, header) will refresh with the preset's values - review and click Save once more to apply. Only colors change; layout/privacy toggles (sidebar, chrome, etc.) are left untouched. This field resets itself after use."
PLG_SYSTEM_FGADMINLOGINCUSTOM_THEME_PRESET_NONE="- Select a preset -"
PLG_SYSTEM_FGADMINLOGINCUSTOM_THEME_PRESET_RESET="Default (Atum template colors)"
PLG_SYSTEM_FGADMINLOGINCUSTOM_THEME_PRESET_DARK="Dark"
PLG_SYSTEM_FGADMINLOGINCUSTOM_THEME_PRESET_CORPORATE_BLUE="Corporate Blue"
PLG_SYSTEM_FGADMINLOGINCUSTOM_THEME_PRESET_GREEN="Green"
PLG_SYSTEM_FGADMINLOGINCUSTOM_THEME_PRESET_ORANGE="Orange"
PLG_SYSTEM_FGADMINLOGINCUSTOM_THEME_PRESET_MINIMAL="Minimal"
PLG_SYSTEM_FGADMINLOGINCUSTOM_PRESET_APPLIED="Preset applied to the color fields below - review and click Save again to store them."
PLG_SYSTEM_FGADMINLOGINCUSTOM_AUTO_CONTRAST_DESC="Leave empty when a background color above is set to auto-calculate a readable black/white text color (WCAG contrast). Set a value here to override the automatic choice."
PLG_SYSTEM_FGADMINLOGINCUSTOM_CARD_SHADOW_LABEL="Card shadow"
PLG_SYSTEM_FGADMINLOGINCUSTOM_CARD_SHADOW_DESC="Adds depth below the login card."
PLG_SYSTEM_FGADMINLOGINCUSTOM_CARD_SHADOW_NONE="None"
PLG_SYSTEM_FGADMINLOGINCUSTOM_CARD_SHADOW_SUBTLE="Subtle"
PLG_SYSTEM_FGADMINLOGINCUSTOM_CARD_SHADOW_MEDIUM="Medium"
PLG_SYSTEM_FGADMINLOGINCUSTOM_CARD_SHADOW_STRONG="Strong"
PLG_SYSTEM_FGADMINLOGINCUSTOM_CUSTOM_JS_LABEL="Custom JavaScript"
PLG_SYSTEM_FGADMINLOGINCUSTOM_CUSTOM_JS_DESC="Optional JavaScript executed on the admin login page only (loaded deferred). Do not wrap it in a script element - paste only the code itself. Use with care: this runs with no sandboxing, same trust level as Custom CSS."
PLG_SYSTEM_FGADMINLOGINCUSTOM_IMPORT_JS_SKIPPED="The imported JSON contained a Custom JavaScript value. It was ignored on purpose: imported code would run on the login page, where the username and password fields are. Enter it manually if you trust it and really need it."
